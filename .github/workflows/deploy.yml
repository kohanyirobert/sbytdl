name: build-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_port:
        description: 'Optional fixed backend port on VPS (leave empty to auto-pick an open one)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build backend
        run: |
          cd backend
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend into backend static dir
        run: |
          mkdir -p backend/publish/wwwroot
          cp -r frontend/dist/sbytdl-web/browser/* backend/publish/wwwroot/

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TARGET_DIR: ${{ secrets.DEPLOY_TARGET_DIR }}
          DEPLOY_PORT: ${{ github.event.inputs.deploy_port }}
        run: ./scripts/deploy.sh
